name: Vérification de la source Commission (temporaire)
on:
  push:
    branches: [claude/eu-commission-countries-refresh-oi3f9s]
    paths: [scripts/update_data.py, .github/workflows/discover.yml]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_data.py --verify
      - run: python scripts/update_data.py --dry-run
