name: Discover EC sources (temporary)
on:
  push:
    branches: [claude/eu-commission-countries-refresh-oi3f9s]
    paths: [scripts/discover_ec.py, .github/workflows/discover.yml]
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/discover_ec.py
